# Step 4 of 14: Bearing Area (QN.xlsx columns P-S) -- 4 crop years
scr_Step4_BearingArea As screen:
  Fill: =RGBA(245, 242, 238, 1)
  Children:
  - lbl_StepHeader As label:
      Text: ="Step 4 / 14 — Bearing Area (ha)"
      X: =20
      Y: =20
      Width: =Parent.Width - 40
      Height: =36
      FontWeight: =FontWeight.Bold
      Size: =18
      Color: =RGBA(74, 51, 35, 1)
  - rect_ProgressTrack As rectangle:
      Fill: =RGBA(226, 220, 211, 1)
      X: =20
      Y: =62
      Width: =Parent.Width - 40
      Height: =6
  - rect_ProgressFill As rectangle:
      Fill: =RGBA(111, 78, 55, 1)
      X: =20
      Y: =62
      Width: =(Parent.Width - 40) * (4/14)
      Height: =6

  - lbl_BearingArea2024_25 As label:
      Text: ="Bearing Area 2024-25 (ha)"
      X: =20
      Y: =90
      Width: =Parent.Width - 40
      Height: =24
      Size: =12
  - num_BearingArea2024_25 As text input.TextInput:
      Default: =Text(varBearingArea2024_25)
      Format: =TextFormat.Number
      X: =20
      Y: =114
      Width: =Parent.Width - 40
      Height: =46
      OnChange: |
        =Set(varBearingArea2024_25, Value(num_BearingArea2024_25.Text))

  - lbl_BearingArea2025_26 As label:
      Text: ="Bearing Area 2025-26 (ha)"
      X: =20
      Y: =170
      Width: =Parent.Width - 40
      Height: =24
      Size: =12
  - num_BearingArea2025_26 As text input.TextInput:
      Default: =Text(varBearingArea2025_26)
      Format: =TextFormat.Number
      X: =20
      Y: =194
      Width: =Parent.Width - 40
      Height: =46
      OnChange: |
        =Set(varBearingArea2025_26, Value(num_BearingArea2025_26.Text))

  - lbl_BearingArea2026_27 As label:
      Text: ="Bearing Area 2026-27 (ha)"
      X: =20
      Y: =250
      Width: =Parent.Width - 40
      Height: =24
      Size: =12
  - num_BearingArea2026_27 As text input.TextInput:
      Default: =Text(varBearingArea2026_27)
      Format: =TextFormat.Number
      X: =20
      Y: =274
      Width: =Parent.Width - 40
      Height: =46
      OnChange: |
        =Set(varBearingArea2026_27, Value(num_BearingArea2026_27.Text))

  - lbl_BearingArea2027_28 As label:
      Text: ="Bearing Area 2027-28 (ha)"
      X: =20
      Y: =330
      Width: =Parent.Width - 40
      Height: =24
      Size: =12
  - num_BearingArea2027_28 As text input.TextInput:
      Default: =Text(varBearingArea2027_28)
      Format: =TextFormat.Number
      X: =20
      Y: =354
      Width: =Parent.Width - 40
      Height: =46
      OnChange: |
        =Set(varBearingArea2027_28, Value(num_BearingArea2027_28.Text))

  - btn_Prev As button:
      Text: ="◀ Previous"
      X: =20
      Y: =Parent.Height - 70
      Width: =(Parent.Width - 60) / 2
      Height: =50
      Fill: =RGBA(255, 255, 255, 1)
      Color: =RGBA(74, 51, 35, 1)
      BorderColor: =RGBA(111, 78, 55, 1)
      BorderThickness: =1.5
      OnSelect: |
        =Navigate(scr_Step3_AdditionalBearing, ScreenTransition.CoverRight)

  - btn_Next As button:
      Text: ="Next ▶"
      X: =Parent.Width/2 + 10
      Y: =Parent.Height - 70
      Width: =(Parent.Width - 60) / 2
      Height: =50
      Fill: =RGBA(111, 78, 55, 1)
      Color: =RGBA(255, 255, 255, 1)
      FontWeight: =FontWeight.Bold
      OnSelect: |
        =Navigate(scr_Step5_Production, ScreenTransition.Cover)
