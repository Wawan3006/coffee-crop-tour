# Step 7 of 14: Stock & Fly Crop Outlook (QN.xlsx columns AM-AO)
scr_Step7_StockFlyOutlook As screen:
  Fill: =RGBA(245, 242, 238, 1)
  Children:
  - lbl_StepHeader As label:
      Text: ="Step 7 / 14 — Stock & Fly Crop Outlook"
      X: =20
      Y: =20
      Width: =Parent.Width - 40
      Height: =36
      FontWeight: =FontWeight.Bold
      Size: =18
      Color: =RGBA(74, 51, 35, 1)
  - rect_ProgressTrack As rectangle:
      Fill: =RGBA(226, 220, 211, 1)
      X: =20
      Y: =62
      Width: =Parent.Width - 40
      Height: =6
  - rect_ProgressFill As rectangle:
      Fill: =RGBA(111, 78, 55, 1)
      X: =20
      Y: =62
      Width: =(Parent.Width - 40) * (7/14)
      Height: =6

  - lbl_ActualStock As label:
      Text: ="Actual stock 2026-27 (Quintal)"
      X: =20
      Y: =90
      Width: =Parent.Width - 40
      Height: =24
      Size: =12
  - num_ActualStock As text input.TextInput:
      Default: =Text(varActualStock202627Quintal)
      Format: =TextFormat.Number
      X: =20
      Y: =114
      Width: =Parent.Width - 40
      Height: =46
      OnChange: |
        =Set(varActualStock202627Quintal, Value(num_ActualStock.Text))

  - lbl_StockRegionPct As label:
      Text: ="Stock in region (%)"
      X: =20
      Y: =170
      Width: =Parent.Width - 40
      Height: =24
      Size: =12
  - num_StockRegionPct As text input.TextInput:
      Default: =Text(varStockRegionPct)
      Format: =TextFormat.Number
      X: =20
      Y: =194
      Width: =Parent.Width - 40
      Height: =46
      OnChange: |
        =Set(varStockRegionPct, Value(num_StockRegionPct.Text))

  - lbl_FlyCropCompareToLY As label:
      Text: ="Fly crop compare to LY"
      X: =20
      Y: =250
      Width: =Parent.Width - 40
      Height: =24
      Size: =12
  - drp_FlyCropCompareToLY As drop down:
      Items: |
        =["1 - Higher", "2 - Same", "3 - Lower"]
      Default: =varFlyCropCompareToLY
      X: =20
      Y: =274
      Width: =Parent.Width - 40
      Height: =46
      OnChange: |
        =Set(varFlyCropCompareToLY, drp_FlyCropCompareToLY.Selected.Value)

  - btn_Prev As button:
      Text: ="◀ Previous"
      X: =20
      Y: =Parent.Height - 70
      Width: =(Parent.Width - 60) / 2
      Height: =50
      Fill: =RGBA(255, 255, 255, 1)
      Color: =RGBA(74, 51, 35, 1)
      BorderColor: =RGBA(111, 78, 55, 1)
      BorderThickness: =1.5
      OnSelect: |
        =Navigate(scr_Step6_Selling, ScreenTransition.CoverRight)

  - btn_Next As button:
      Text: ="Next ▶"
      X: =Parent.Width/2 + 10
      Y: =Parent.Height - 70
      Width: =(Parent.Width - 60) / 2
      Height: =50
      Fill: =RGBA(111, 78, 55, 1)
      Color: =RGBA(255, 255, 255, 1)
      FontWeight: =FontWeight.Bold
      OnSelect: |
        =Navigate(scr_Step8_FlyCropVolumes, ScreenTransition.Cover)
