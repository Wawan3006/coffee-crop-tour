# Step 6 of 14: Selling 2026-27 Crop (QN.xlsx columns X-AL) -- 15 monthly fields.
# Uses a data table pattern (gallery bound to a static month table) rather than
# 15 hand-placed controls, since Power Fx galleries are the correct pattern for
# a repeating monthly-input structure and keeps this screen maintainable.
scr_Step6_Selling As screen:
  Fill: =RGBA(245, 242, 238, 1)
  OnVisible: |
    =Set(
      varSellingMonths,
      Table(
        { Month: "Nov-25", Varname: "sellingNov25", Value: varSellingNov25 },
        { Month: "Dec-25", Varname: "sellingDec25", Value: varSellingDec25 },
        { Month: "Jan-26", Varname: "sellingJan26", Value: varSellingJan26 },
        { Month: "Feb-26", Varname: "sellingFeb26", Value: varSellingFeb26 },
        { Month: "Mar-26", Varname: "sellingMar26", Value: varSellingMar26 },
        { Month: "Apr-26", Varname: "sellingApr26", Value: varSellingApr26 },
        { Month: "May-26", Varname: "sellingMay26", Value: varSellingMay26 },
        { Month: "Jun-26", Varname: "sellingJun26", Value: varSellingJun26 },
        { Month: "Jul-26", Varname: "sellingJul26", Value: varSellingJul26 },
        { Month: "Aug-26", Varname: "sellingAug26", Value: varSellingAug26 },
        { Month: "Sep-26", Varname: "sellingSep26", Value: varSellingSep26 },
        { Month: "Oct-26", Varname: "sellingOct26", Value: varSellingOct26 },
        { Month: "Nov-26", Varname: "sellingNov26", Value: varSellingNov26 },
        { Month: "Dec-26", Varname: "sellingDec26", Value: varSellingDec26 },
        { Month: "Undecided", Varname: "sellingUndecided", Value: varSellingUndecided }
      )
    )
  Children:
  - lbl_StepHeader As label:
      Text: ="Step 6 / 14 — Selling 2026-27 Crop"
      X: =20
      Y: =20
      Width: =Parent.Width - 40
      Height: =36
      FontWeight: =FontWeight.Bold
      Size: =18
      Color: =RGBA(74, 51, 35, 1)
  - rect_ProgressTrack As rectangle:
      Fill: =RGBA(226, 220, 211, 1)
      X: =20
      Y: =62
      Width: =Parent.Width - 40
      Height: =6
  - rect_ProgressFill As rectangle:
      Fill: =RGBA(111, 78, 55, 1)
      X: =20
      Y: =62
      Width: =(Parent.Width - 40) * (6/14)
      Height: =6

  - lbl_Instructions As label:
      Text: ="Quintals sold or planned to sell, by month (15 entries)"
      X: =20
      Y: =84
      Width: =Parent.Width - 40
      Height: =24
      Size: =11
      Color: =RGBA(122, 111, 99, 1)

  - gal_SellingMonths As gallery.Vertical:
      Items: =varSellingMonths
      X: =20
      Y: =114
      Width: =Parent.Width - 40
      Height: =Parent.Height - 200
      TemplateSize: =60
      Children:
      - lbl_MonthLabel As label:
          Text: =ThisItem.Month
          X: =0
          Y: =8
          Width: =150
          Height: =44
          Size: =13
          FontWeight: =FontWeight.Semibold
          VerticalAlign: =VerticalAlign.Middle
      - num_MonthValue As text input.TextInput:
          Default: =Text(ThisItem.Value)
          Format: =TextFormat.Number
          X: =160
          Y: =4
          Width: =Parent.TemplateWidth - 170
          Height: =46
          # Each row writes back to its own named context variable so the
          # single gallery template still updates 15 distinct App vars.
          OnChange: |
            =Switch(
              ThisItem.Varname,
              "sellingNov25", Set(varSellingNov25, Value(num_MonthValue.Text)),
              "sellingDec25", Set(varSellingDec25, Value(num_MonthValue.Text)),
              "sellingJan26", Set(varSellingJan26, Value(num_MonthValue.Text)),
              "sellingFeb26", Set(varSellingFeb26, Value(num_MonthValue.Text)),
              "sellingMar26", Set(varSellingMar26, Value(num_MonthValue.Text)),
              "sellingApr26", Set(varSellingApr26, Value(num_MonthValue.Text)),
              "sellingMay26", Set(varSellingMay26, Value(num_MonthValue.Text)),
              "sellingJun26", Set(varSellingJun26, Value(num_MonthValue.Text)),
              "sellingJul26", Set(varSellingJul26, Value(num_MonthValue.Text)),
              "sellingAug26", Set(varSellingAug26, Value(num_MonthValue.Text)),
              "sellingSep26", Set(varSellingSep26, Value(num_MonthValue.Text)),
              "sellingOct26", Set(varSellingOct26, Value(num_MonthValue.Text)),
              "sellingNov26", Set(varSellingNov26, Value(num_MonthValue.Text)),
              "sellingDec26", Set(varSellingDec26, Value(num_MonthValue.Text)),
              "sellingUndecided", Set(varSellingUndecided, Value(num_MonthValue.Text))
            )

  - btn_Prev As button:
      Text: ="◀ Previous"
      X: =20
      Y: =Parent.Height - 70
      Width: =(Parent.Width - 60) / 2
      Height: =50
      Fill: =RGBA(255, 255, 255, 1)
      Color: =RGBA(74, 51, 35, 1)
      BorderColor: =RGBA(111, 78, 55, 1)
      BorderThickness: =1.5
      OnSelect: |
        =Navigate(scr_Step5_Production, ScreenTransition.CoverRight)

  - btn_Next As button:
      Text: ="Next ▶"
      X: =Parent.Width/2 + 10
      Y: =Parent.Height - 70
      Width: =(Parent.Width - 60) / 2
      Height: =50
      Fill: =RGBA(111, 78, 55, 1)
      Color: =RGBA(255, 255, 255, 1)
      FontWeight: =FontWeight.Bold
      OnSelect: |
        =Navigate(scr_Step7_StockFlyOutlook, ScreenTransition.Cover)
