# Step 2 of 14: Coffee Area (QN.xlsx columns I-K)
# Fields: totalCoffeeAreaHaMar2025, totalCoffeeAreaHa, additionalExpandingTreesPerHa
scr_Step2_CoffeeArea As screen:
  Fill: =RGBA(245, 242, 238, 1)
  Children:
  - lbl_StepHeader As label:
      Text: ="Step 2 / 14 — Coffee Area"
      X: =20
      Y: =20
      Width: =Parent.Width - 40
      Height: =36
      FontWeight: =FontWeight.Bold
      Size: =18
      Color: =RGBA(74, 51, 35, 1)

  - rect_ProgressTrack As rectangle:
      Fill: =RGBA(226, 220, 211, 1)
      X: =20
      Y: =62
      Width: =Parent.Width - 40
      Height: =6
  - rect_ProgressFill As rectangle:
      Fill: =RGBA(111, 78, 55, 1)
      X: =20
      Y: =62
      Width: =(Parent.Width - 40) * (2/14)
      Height: =6

  - lbl_TotalCoffeeAreaMar2025 As label:
      Text: ="Total Coffee Area (Ha) Mar 2025"
      X: =20
      Y: =90
      Width: =Parent.Width - 40
      Height: =24
      Size: =12
      Color: =RGBA(122, 111, 99, 1)
  - num_TotalCoffeeAreaMar2025 As text input.TextInput:
      Default: =Text(varTotalCoffeeAreaHaMar2025)
      Format: =TextFormat.Number
      X: =20
      Y: =114
      Width: =Parent.Width - 40
      Height: =46
      OnChange: |
        =Set(varTotalCoffeeAreaHaMar2025, Value(num_TotalCoffeeAreaMar2025.Text))

  - lbl_TotalCoffeeArea As label:
      Text: ="Total Coffee Area (Ha)"
      X: =20
      Y: =170
      Width: =Parent.Width - 40
      Height: =24
      Size: =12
      Color: =RGBA(122, 111, 99, 1)
  - num_TotalCoffeeArea As text input.TextInput:
      Default: =Text(varTotalCoffeeAreaHa)
      Format: =TextFormat.Number
      X: =20
      Y: =194
      Width: =Parent.Width - 40
      Height: =46
      OnChange: |
        =Set(varTotalCoffeeAreaHa, Value(num_TotalCoffeeArea.Text))

  - lbl_AdditionalExpanding As label:
      Text: ="Additional/expanding trees / Ha"
      X: =20
      Y: =250
      Width: =Parent.Width - 40
      Height: =24
      Size: =12
      Color: =RGBA(122, 111, 99, 1)
  - num_AdditionalExpanding As text input.TextInput:
      Default: =Text(varAdditionalExpandingTreesPerHa)
      Format: =TextFormat.Number
      X: =20
      Y: =274
      Width: =Parent.Width - 40
      Height: =46
      OnChange: |
        =Set(varAdditionalExpandingTreesPerHa, Value(num_AdditionalExpanding.Text))

  - btn_Prev As button:
      Text: ="◀ Previous"
      X: =20
      Y: =Parent.Height - 70
      Width: =(Parent.Width - 60) / 2
      Height: =50
      Fill: =RGBA(255, 255, 255, 1)
      Color: =RGBA(74, 51, 35, 1)
      BorderColor: =RGBA(111, 78, 55, 1)
      BorderThickness: =1.5
      OnSelect: |
        =Navigate(scr_Step1_SampleFarmer, ScreenTransition.CoverRight)

  - btn_Next As button:
      Text: ="Next ▶"
      X: =Parent.Width/2 + 10
      Y: =Parent.Height - 70
      Width: =(Parent.Width - 60) / 2
      Height: =50
      Fill: =RGBA(111, 78, 55, 1)
      Color: =RGBA(255, 255, 255, 1)
      FontWeight: =FontWeight.Bold
      OnSelect: |
        =Navigate(scr_Step3_AdditionalBearing, ScreenTransition.Cover)
