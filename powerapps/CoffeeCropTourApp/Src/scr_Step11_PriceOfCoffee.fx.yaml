# Step 11 of 14: Price of Coffee IDR/Kg (QN.xlsx columns BH-BM)
scr_Step11_PriceOfCoffee As screen:
  Fill: =RGBA(245, 242, 238, 1)
  Children:
  - lbl_StepHeader As label:
      Text: ="Step 11 / 14 — Price of Coffee (IDR/Kg)"
      X: =20
      Y: =20
      Width: =Parent.Width - 40
      Height: =36
      FontWeight: =FontWeight.Bold
      Size: =16
      Color: =RGBA(74, 51, 35, 1)
  - rect_ProgressTrack As rectangle:
      Fill: =RGBA(226, 220, 211, 1)
      X: =20
      Y: =62
      Width: =Parent.Width - 40
      Height: =6
  - rect_ProgressFill As rectangle:
      Fill: =RGBA(111, 78, 55, 1)
      X: =20
      Y: =62
      Width: =(Parent.Width - 40) * (11/14)
      Height: =6

  - lbl_AvgPriceSold As label:
      Text: ="Avg price sold 2025-26 (IDR/Kg)"
      X: =20
      Y: =90
      Width: =Parent.Width - 40
      Height: =24
      Size: =12
  - num_AvgPriceSold As text input.TextInput:
      Default: =Text(varAvgPriceSold2025_26)
      Format: =TextFormat.Number
      X: =20
      Y: =114
      Width: =Parent.Width - 40
      Height: =46
      OnChange: |
        =Set(varAvgPriceSold2025_26, Value(num_AvgPriceSold.Text))

  - lbl_ExistingPrice As label:
      Text: ="Existing price (IDR/Kg)"
      X: =20
      Y: =170
      Width: =Parent.Width - 40
      Height: =24
      Size: =12
  - num_ExistingPrice As text input.TextInput:
      Default: =Text(varExistingPrice)
      Format: =TextFormat.Number
      X: =20
      Y: =194
      Width: =Parent.Width - 40
      Height: =46
      OnChange: |
        =Set(varExistingPrice, Value(num_ExistingPrice.Text))

  - lbl_ExpectedPrice As label:
      Text: ="Expected price (IDR/Kg)"
      X: =20
      Y: =250
      Width: =Parent.Width - 40
      Height: =24
      Size: =12
  - num_ExpectedPrice As text input.TextInput:
      Default: =Text(varExpectedPrice)
      Format: =TextFormat.Number
      X: =20
      Y: =274
      Width: =Parent.Width - 40
      Height: =46
      OnChange: |
        =Set(varExpectedPrice, Value(num_ExpectedPrice.Text))

  - lbl_OpinionCurrentPrice As label:
      Text: ="Opinion on current price"
      X: =20
      Y: =330
      Width: =Parent.Width - 40
      Height: =24
      Size: =12
  - txt_OpinionCurrentPrice As text input.TextInput:
      Default: =varOpinionCurrentPrice
      X: =20
      Y: =354
      Width: =Parent.Width - 40
      Height: =46
      OnChange: |
        =Set(varOpinionCurrentPrice, txt_OpinionCurrentPrice.Text)

  - lbl_FuturePrice As label:
      Text: ="Future price outlook"
      X: =20
      Y: =410
      Width: =Parent.Width - 40
      Height: =24
      Size: =12
  - drp_FuturePrice As drop down:
      Items: =["B - Bullish", "N - Neutral", "Br - Bearish"]
      Default: =varFuturePrice
      X: =20
      Y: =434
      Width: =Parent.Width - 40
      Height: =46
      OnChange: |
        =Set(varFuturePrice, drp_FuturePrice.Selected.Value)

  - lbl_ReactionHigherPrice As label:
      Text: ="Reaction to higher price"
      X: =20
      Y: =490
      Width: =Parent.Width - 40
      Height: =24
      Size: =12
  - txt_ReactionHigherPrice As text input.TextInput:
      Default: =varReactionHigherPrice
      X: =20
      Y: =514
      Width: =Parent.Width - 40
      Height: =46
      OnChange: |
        =Set(varReactionHigherPrice, txt_ReactionHigherPrice.Text)

  - btn_Prev As button:
      Text: ="◀ Previous"
      X: =20
      Y: =Parent.Height - 70
      Width: =(Parent.Width - 60) / 2
      Height: =50
      Fill: =RGBA(255, 255, 255, 1)
      Color: =RGBA(74, 51, 35, 1)
      BorderColor: =RGBA(111, 78, 55, 1)
      BorderThickness: =1.5
      OnSelect: |
        =Navigate(scr_Step10_WeatherDevelopment, ScreenTransition.CoverRight)

  - btn_Next As button:
      Text: ="Next ▶"
      X: =Parent.Width/2 + 10
      Y: =Parent.Height - 70
      Width: =(Parent.Width - 60) / 2
      Height: =50
      Fill: =RGBA(111, 78, 55, 1)
      Color: =RGBA(255, 255, 255, 1)
      FontWeight: =FontWeight.Bold
      OnSelect: |
        =Navigate(scr_Step12_LaborInputs, ScreenTransition.Cover)
