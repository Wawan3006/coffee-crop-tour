# Step 13 of 14: Photos (app feature, not a QN.xlsx column) + GPS capture.
# Uses Power Apps' native Camera control and Location signal -- these are
# genuinely built-in, working controls (no custom JS needed for this part).
scr_Step13_Photos As screen:
  Fill: =RGBA(245, 242, 238, 1)
  Children:
  - lbl_StepHeader As label:
      Text: ="Step 13 / 14 — Photos & GPS"
      X: =20
      Y: =20
      Width: =Parent.Width - 40
      Height: =36
      FontWeight: =FontWeight.Bold
      Size: =18
      Color: =RGBA(74, 51, 35, 1)
  - rect_ProgressTrack As rectangle:
      Fill: =RGBA(226, 220, 211, 1)
      X: =20
      Y: =62
      Width: =Parent.Width - 40
      Height: =6
  - rect_ProgressFill As rectangle:
      Fill: =RGBA(111, 78, 55, 1)
      X: =20
      Y: =62
      Width: =(Parent.Width - 40) * (13/14)
      Height: =6

  - btn_CaptureGps As button:
      Text: ="📍 Capture GPS"
      X: =20
      Y: =90
      Width: =Parent.Width - 40
      Height: =50
      Fill: =RGBA(46, 125, 50, 1)
      Color: =RGBA(255, 255, 255, 1)
      OnSelect: |
        =Set(varGpsLat, Location.Latitude);
        Set(varGpsLon, Location.Longitude);
        Set(varGpsAccuracyM, Location.Accuracy);
        Notify("GPS captured: " & Text(varGpsLat) & ", " & Text(varGpsLon), NotificationType.Success)

  - lbl_GpsResult As label:
      Text: |
        =If(
          IsBlank(varGpsLat),
          "Not captured yet",
          Text(varGpsLat) & ", " & Text(varGpsLon) & " (±" & Text(varGpsAccuracyM) & "m)"
        )
      X: =20
      Y: =150
      Width: =Parent.Width - 40
      Height: =30
      Size: =12
      Color: =RGBA(122, 111, 99, 1)
      Align: =Align.Center

  - cam_FarmPhoto As camera:
      X: =20
      Y: =200
      Width: =Parent.Width - 40
      Height: =240
      OnSelect: |
        =Collect(
          colFarmPhotos,
          {
            Photo: cam_FarmPhoto.Photo,
            CapturedAt: Now(),
            Lat: varGpsLat,
            Lon: varGpsLon
          }
        );
        Notify("Photo captured (" & CountRows(colFarmPhotos) & " total).", NotificationType.Success)

  - gal_Photos As gallery.Horizontal:
      Items: =colFarmPhotos
      X: =20
      Y: =460
      Width: =Parent.Width - 40
      Height: =120
      TemplateSize: =110
      Children:
      - img_Thumb As image:
          Image: =ThisItem.Photo
          X: =0
          Y: =0
          Width: =Parent.TemplateWidth - 10
          Height: =100

  - btn_Prev As button:
      Text: ="◀ Previous"
      X: =20
      Y: =Parent.Height - 70
      Width: =(Parent.Width - 60) / 2
      Height: =50
      Fill: =RGBA(255, 255, 255, 1)
      Color: =RGBA(74, 51, 35, 1)
      BorderColor: =RGBA(111, 78, 55, 1)
      BorderThickness: =1.5
      OnSelect: |
        =Navigate(scr_Step12_LaborInputs, ScreenTransition.CoverRight)

  - btn_Next As button:
      Text: ="Next ▶"
      X: =Parent.Width/2 + 10
      Y: =Parent.Height - 70
      Width: =(Parent.Width - 60) / 2
      Height: =50
      Fill: =RGBA(111, 78, 55, 1)
      Color: =RGBA(255, 255, 255, 1)
      FontWeight: =FontWeight.Bold
      OnSelect: |
        =Navigate(scr_Step14_Review, ScreenTransition.Cover)
