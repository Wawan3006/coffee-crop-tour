# Step 12 of 14: Labor & Inputs (QN.xlsx columns BN-BW)
scr_Step12_LaborInputs As screen:
  Fill: =RGBA(245, 242, 238, 1)
  Children:
  - lbl_StepHeader As label:
      Text: ="Step 12 / 14 — Labor & Inputs"
      X: =20
      Y: =20
      Width: =Parent.Width - 40
      Height: =36
      FontWeight: =FontWeight.Bold
      Size: =18
      Color: =RGBA(74, 51, 35, 1)
  - rect_ProgressTrack As rectangle:
      Fill: =RGBA(226, 220, 211, 1)
      X: =20
      Y: =62
      Width: =Parent.Width - 40
      Height: =6
  - rect_ProgressFill As rectangle:
      Fill: =RGBA(111, 78, 55, 1)
      X: =20
      Y: =62
      Width: =(Parent.Width - 40) * (12/14)
      Height: =6

  - lbl_LaborWage2025 As label:
      Text: ="Labor wage 2025 (IDR/day)"
      X: =20
      Y: =90
      Width: =(Parent.Width - 60)/2
      Height: =24
      Size: =11
  - num_LaborWage2025 As text input.TextInput:
      Default: =Text(varLaborWage2025)
      Format: =TextFormat.Number
      X: =20
      Y: =114
      Width: =(Parent.Width - 60)/2
      Height: =46
      OnChange: |
        =Set(varLaborWage2025, Value(num_LaborWage2025.Text))

  - lbl_LaborWage2026 As label:
      Text: ="Labor wage 2026 (IDR/day)"
      X: =Parent.Width/2 + 10
      Y: =90
      Width: =(Parent.Width - 60)/2
      Height: =24
      Size: =11
  - num_LaborWage2026 As text input.TextInput:
      Default: =Text(varLaborWage2026)
      Format: =TextFormat.Number
      X: =Parent.Width/2 + 10
      Y: =114
      Width: =(Parent.Width - 60)/2
      Height: =46
      OnChange: |
        =Set(varLaborWage2026, Value(num_LaborWage2026.Text))

  - lbl_HerbicideType As label:
