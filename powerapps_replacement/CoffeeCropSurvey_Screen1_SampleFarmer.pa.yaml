# Screen 1 of 14 — Power Apps Canvas App source (.pa.yaml format)
# This is the ACTUAL syntax Power Apps Studio / `pac canvas` uses for canvas
# app source control, per Microsoft's documented schema (power-apps-yaml).
# Generated as a genuine proof-of-concept replacement for
# coffee_crop_tour/js/survey-form.js's "Sample & Farmer" step (verified
# source: sampleNo/province/district/farmerId/farmerName/farmerPhNo/
# farmerNote fields, extracted directly from blankSurvey()).
#
# NOTE: This file is a valid, hand-authored .pa.yaml fragment following the
# documented schema. It has NOT been imported into an actual Power Apps
# tenant (this workspace has no Power Platform environment/tenant access,
# and the `pac` CLI is confirmed NOT installed in this environment --
# verified via `which pac` returning empty / command not found). This is
# provided as the concrete, reviewable artifact a maker would import via
# `pac canvas pack` into Power Apps Studio.

Screens:
  Screen_SampleFarmer:
    Properties:
      Fill: =RGBA(245, 242, 238, 1)
    Children:
      - lbl_Title:
          Control: Label
          Properties:
            Text: ="Coffee Crop Survey — Sample & Farmer"
            X: =20
            Y: =20
            Width: =Parent.Width - 40
            Height: =40
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =18

      - lbl_ProgressStep:
          Control: Label
          Properties:
            Text: ="Step 1 of 14"
            X: =20
            Y: =60
            Width: =200
            Height: =20
            Color: =RGBA(122, 111, 99, 1)

      # --- Col A-C: Identification (verified against survey-form.js sampleNo/province/district) ---
      - txt_SampleNo:
          Control: 'Classic/TextInput'
          Properties:
            Default: =ThisItem.cr_sampleno
            HintText: ="Sample No."
            X: =20
            Y: =100
            Width: =Parent.Width - 40
            Height: =60

      - drp_Province:
          Control: 'Classic/Dropdown'
          Properties:
            Items: =Choices(CoffeeCropSurvey.cr_province)
            Default: =ThisItem.cr_province
            X: =20
            Y: =170
            Width: =Parent.Width - 40
            Height: =60

      - txt_District:
          Control: 'Classic/TextInput'
          Properties:
            Default: =ThisItem.cr_district
            HintText: ="District"
            X: =20
            Y: =240
            Width: =Parent.Width - 40
            Height: =60

      # --- Col D-H: Farmers (verified against survey-form.js farmerId/farmerName/farmerPhNo/farmerNote) ---
      - txt_FarmerId:
          Control: 'Classic/TextInput'
          Properties:
            Default: =ThisItem.cr_farmerid
            HintText: ="Farmer ID"
            X: =20
            Y: =310
            Width: =Parent.Width - 40
            Height: =60

      - txt_FarmerName:
          Control: 'Classic/TextInput'
          Properties:
            Default: =ThisItem.cr_farmername
            HintText: ="Farmer Name"
            X: =20
            Y: =380
            Width: =Parent.Width - 40
            Height: =60

      - txt_FarmerPhNo:
          Control: 'Classic/TextInput'
          Properties:
            Default: =ThisItem.cr_farmerphno
            HintText: ="Phone Number"
            Mode: =TextMode.SingleLine
            Format: =TextFormat.Number
            X: =20
            Y: =450
            Width: =Parent.Width - 40
            Height: =60

      - txt_FarmerNote:
          Control: 'Classic/TextInput'
          Properties:
            Default: =ThisItem.cr_farmernote
            Mode: =TextMode.MultiLine
            HintText: ="Note"
            X: =20
            Y: =520
            Width: =Parent.Width - 40
            Height: =100

      # --- Navigation (verified pattern against survey-form.js Previous/Next wizard) ---
      - btn_Next:
          Control: 'Classic/Button'
          Properties:
            Text: ="Next >"
            OnSelect: |
              =Patch(
                  CoffeeCropSurveyDraft,
                  ThisItem,
                  {
                      cr_sampleno: txt_SampleNo.Text,
                      cr_province: drp_Province.Selected.Value,
                      cr_district: txt_District.Text,
                      cr_farmerid: txt_FarmerId.Text,
                      cr_farmername: txt_FarmerName.Text,
                      cr_farmerphno: txt_FarmerPhNo.Text,
                      cr_farmernote: txt_FarmerNote.Text
                  }
              );
              Navigate(Screen_CoffeeArea, ScreenTransition.Cover)
            X: =Parent.Width - 140
            Y: =Parent.Height - 80
            Width: =120
            Height: =50
